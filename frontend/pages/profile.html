<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Sistema de Inventario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <div class="nav-bar">
                <h2>👤 Mi Perfil</h2>
                <div>
                    <button onclick="location.href='companies.html'" class="btn">🏢 Empresas</button>
                    <button onclick="logout()" class="btn">🚪 Salir</button>
                </div>
            </div>
            
            <div id="alert" class="hidden"></div>
            
            <!-- Profile Info -->
            <div class="card">
                <h3>Información de Perfil</h3>
                <div id="profileInfo" class="loading">Cargando perfil...</div>
            </div>
            
            <!-- Edit Profile -->
            <div class="card">
                <h3>Actualizar Perfil</h3>
                <form id="updateProfileForm">
                    <div class="form-group">
                        <label for="username">Nombre de Usuario</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="new_password">Nueva Contraseña (dejar vacío si no desea cambiar)</label>
                        <input type="password" id="new_password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirmar Nueva Contraseña</label>
                        <input type="password" id="confirm_password" minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
