<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Inventario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>📝 Registro de Usuario</h1>
            
            <div id="alert" class="hidden"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirmar Contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 15px;">
                    Registrarse
                </button>
            </form>
            
            <p style="text-align: center; color: #6B7280;">
                ¿Ya tienes cuenta? <a href="login.html" style="color: var(--primary-color); text-decoration: none;">Inicia sesión aquí</a>
            </p>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="../index.html" style="color: #6B7280; text-decoration: none;">← Volver al inicio</a>
            </p>
        </div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
