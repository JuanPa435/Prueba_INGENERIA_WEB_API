<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Inventario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>🔐 Iniciar Sesión</h1>
            
            <div id="alert" class="hidden"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username_or_email">Usuario o Correo Electrónico</label>
                    <input type="text" id="username_or_email" name="username_or_email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 15px;">
                    Iniciar Sesión
                </button>
            </form>
            
            <p style="text-align: center; color: #6B7280;">
                ¿No tienes cuenta? <a href="register.html" style="color: var(--primary-color); text-decoration: none;">Regístrate aquí</a>
            </p>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="../index.html" style="color: #6B7280; text-decoration: none;">← Volver al inicio</a>
            </p>
        </div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
